services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qurultai-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DEBUG: "true"
      API_PREFIX: /api
      SQLITE_DB_PATH: data/sqlite/database.db
      DATA_DIR: data
      SQLITE_DIR: data/sqlite
      UPLOADS_DIR: data/uploads
      REPORTS_DIR: data/reports
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: nemotron-3-nano:30b-cloud
      OLLAMA_TEMPERATURE: "0.1"
      OLLAMA_TIMEOUT_SECONDS: "20"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: room_steps
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET: room-artifacts
    depends_on:
      - qdrant
      - minio
      - ollama
    volumes:
      - ./data:/app/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qurultai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: qurultai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  minio:
    image: minio/minio:latest
    container_name: qurultai-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  qdrant_data:
  ollama_data:
  minio_data:
