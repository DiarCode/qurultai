[project]
name = "backend"
version = "0.1.0"
description = "GovOrchestrator AI backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.42.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "minio>=7.2.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.3.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
plugins = []
strict = false
warn_unused_configs = true
